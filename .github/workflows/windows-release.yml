name: Windows 11 Release Build & Verification

on:
  push:
    branches: [ "main", "master", "v0.3.x" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Verify Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Resolve and Validate Release Version
        id: version
        shell: powershell
        run: |
          $rawRef = "${{ github.ref_name }}"
          $refType = "${{ github.ref_type }}"
          Write-Host "Triggered by ${refType} - '$rawRef'"

          # 1. Resolve canonical version
          if ($refType -eq "tag" -or $rawRef -match '^v?\d+\.\d+\.\d+') {
            if ($rawRef -match '^v?(\d+\.\d+\.\d+.*)$') {
              $ver = $Matches[1]
            } else {
              throw "Invalid version tag format: '$rawRef'. Expected semantic version like 'v0.3.1' or '0.3.1'."
            }
          } else {
            # On branch builds (e.g. main), extract canonical base version from CMakeLists.txt
            $cmakePath = "CMakeLists.txt"
            $ver = "0.3.0"
            if (Test-Path $cmakePath) {
              $cmakeContent = Get-Content $cmakePath -Raw
              if ($cmakeContent -match 'project\s*\(\s*Flux\s+VERSION\s+(\d+\.\d+\.\d+)') {
                $ver = $Matches[1]
              }
            }
            Write-Host "Non-tag build on branch '$rawRef'; using repository base version: $ver"
          }

          # 2. Validate version is clean SemVer
          if ($ver -notmatch '^\d+\.\d+\.\d+([.-].+)?$') {
            throw "Resolved version '$ver' is not valid SemVer (e.g. 0.3.1, 0.3.1-beta.1)"
          }

          Write-Host "Canonical release version: $ver"
          "FLUX_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Preflight Toolchain & CMake Inspection
        shell: powershell
        run: |
          Write-Host "=== CMake Version ==="
          cmake --version
          Write-Host "`n=== MSVC Compiler (cl.exe) ==="
          Get-Command cl.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          cmd.exe /c "cl 2>&1" | Select-Object -First 1
          Write-Host "`n=== Available CMake Generators ==="
          cmake --help

      - name: Configure CMake
        shell: powershell
        run: |
          Write-Host "Active VisualStudioVersion: $env:VisualStudioVersion, VSINSTALLDIR: $env:VSINSTALLDIR"
          $helpText = (cmake --help | Out-String)
          $candidates = @()
          if ($env:VisualStudioVersion -like "18*" -or $env:VSINSTALLDIR -like "*\18\*") {
              $candidates += 'Visual Studio 18 2026'
          } elseif ($env:VisualStudioVersion -like "17*" -or $env:VSINSTALLDIR -like "*2022*") {
              $candidates += 'Visual Studio 17 2022'
          }
          if ($helpText -match '\*\s+(Visual Studio [^\r\n=]+?)\s*=') {
              $candidates += $Matches[1].Trim()
          }
          $candidates += @('Visual Studio 18 2026', 'Visual Studio 17 2022', '')

          $configured = $false
          foreach ($gen in ($candidates | Select-Object -Unique)) {
              Write-Host "Attempting CMake configuration with generator: '$gen'..."
              Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
              if ($gen -eq '') {
                  cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release
              } else {
                  cmake -B build -G "$gen" -A x64 -DCMAKE_BUILD_TYPE=Release
              }
              if ($LASTEXITCODE -eq 0) {
                  $configured = $true
                  Write-Host "Successfully configured CMake with generator: '$gen'"
                  break
              }
          }
          if (-not $configured) {
              throw "CMake configuration failed for all candidate generators."
          }

      - name: Build Windows Targets
        run: |
          cmake --build build --config Release --target flux flux-nmh flux_unit_tests openidm openidm-nmh openidm_unit_tests N_m3u8DL-RE

      - name: Provision Upstream Stream Workers (N_m3u8DL-RE & FFmpeg)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/fetch-workers.ps1 -TargetDir tools/win-x64

      - name: Audit Stream Workers and FFmpeg Capabilities
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/verify-ffmpeg-capabilities.ps1 -RunSmokeTests
          $ffPath = "tools/win-x64/ffmpeg.exe"
          $nmPath = "tools/win-x64/N_m3u8DL-RE.exe"
          $ytPath = "tools/win-x64/yt-dlp.exe"
          Write-Host "`n=== Stream Worker Verification Audit ==="
          foreach ($p in @($ffPath, $nmPath, $ytPath)) {
            if (-not (Test-Path $p)) { throw "Required worker missing: $p" }
            $item = Get-Item $p
            $hash = (Get-FileHash $p -Algorithm SHA256).Hash
            Write-Host "$($item.Name): $($item.Length) bytes ($([Math]::Round($item.Length/1MB, 2)) MB) [SHA256: $hash]"
          }
          if ((Get-Item $ffPath).Length -gt 25MB) {
            throw "FFmpeg exceeds 25 MB minimal budget! Monolithic upstream build detected."
          }
          if ((Get-Item $nmPath).Length -gt 5MB) {
            throw "N_m3u8DL-RE exceeds 5 MB native worker budget! Upstream .NET build detected."
          }

      - name: Verify PE32+ Binaries & Subsystems
        shell: powershell
        run: |
          $bins = @(
            @{ Path = "build/Release/flux.exe"; ExpectedSubsystem = 2 },
            @{ Path = "build/Release/flux-nmh.exe"; ExpectedSubsystem = 3 },
            @{ Path = "build/Release/flux_unit_tests.exe"; ExpectedSubsystem = 3 }
          )
          foreach ($b in $bins) {
            if (-not (Test-Path $b.Path)) {
              throw "Binary missing: $($b.Path)"
            }
            $bytes = [System.IO.File]::ReadAllBytes($b.Path)
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              throw "Invalid MZ header: $($b.Path)"
            }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0x8664) {
              throw "Expected AMD64 (0x8664) machine type: $($b.Path)"
            }
            $optOffset = $peOffset + 24
            $magic = [BitConverter]::ToUInt16($bytes, $optOffset)
            if ($magic -ne 0x20B) {
              throw "Expected PE32+ (0x20B) magic: $($b.Path)"
            }
            $subsystem = [BitConverter]::ToUInt16($bytes, $optOffset + 68)
            if ($subsystem -ne $b.ExpectedSubsystem) {
              throw "Expected subsystem $($b.ExpectedSubsystem), got $subsystem for $($b.Path)"
            }
            Write-Host "Verified $($b.Path): AMD64 PE32+ Subsystem=$subsystem"
          }

      - name: Run C++ Unit & Regression Tests
        shell: powershell
        run: |
          .\build\Release\flux_unit_tests.exe

      - name: Run Browser Extension Detection Tests
        shell: powershell
        run: |
          node tests/test_extension_detection.js

      - name: Run End-to-End Integration & Benchmark Suite
        shell: powershell
        run: |
          python tests/run_all_integration_tests.py

      - name: Run Automated Performance Benchmarks
        shell: powershell
        run: |
          python scripts/run-benchmarks.py

      - name: Compile Inno Setup Installer
        shell: powershell
        run: |
          $issPath = "installer/flux.iss"
          if (-not (Test-Path $issPath)) {
            $issPath = "installer/openidm.iss"
          }
          $isccArgs = @("/DMyAppVersion=$env:FLUX_VERSION", $issPath)
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" @isccArgs
          } elseif (Test-Path "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe") {
            & "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe" @isccArgs
          } else {
            choco install innosetup -y
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" @isccArgs
          }

      - name: Package Standalone Portable Releases (Full & Core)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/package-release-zip.ps1 -Version "$env:FLUX_VERSION" -PackageType Both -BuildDir "build/Release"
          Write-Host "`n=== Final SHA-256 Release Checksums ==="
          Get-Content "dist/SHA256SUMS.txt"

      - name: Packaging Size Budget Audit & Verification
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/report-package-sizes.ps1 -Version "$env:FLUX_VERSION" -DistDir "dist" -UpdateMetrics -FailOnExceeded

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flux-v${{ env.FLUX_VERSION }}-windows-x64
          path: |
            dist/*-Setup-*.exe
            dist/Flux-v${{ env.FLUX_VERSION }}-Windows-x64-Full.zip
            dist/Flux-v${{ env.FLUX_VERSION }}-Windows-x64-Core.zip
            dist/SHA256SUMS.txt
            benchmarks/latest_metrics.json
            docs/BENCHMARK_REPORT.md

      - name: Publish Official GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Flux Download Manager ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Flux-Setup-x64-${{ env.FLUX_VERSION }}.exe
            dist/Flux-v${{ env.FLUX_VERSION }}-Windows-x64-Full.zip
            dist/Flux-v${{ env.FLUX_VERSION }}-Windows-x64-Core.zip
            dist/Flux-v${{ env.FLUX_VERSION }}-Windows-x64.zip
            dist/SHA256SUMS.txt
            LICENSE
            THIRD_PARTY_NOTICES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
