name: Windows 11 Release Build & Verification

on:
  push:
    branches: [ "main", "master", "v0.2.x" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Verify Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Provision Upstream Stream Workers (N_m3u8DL-RE & FFmpeg)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/fetch-workers.ps1

      - name: Preflight Toolchain & CMake Inspection
        shell: powershell
        run: |
          Write-Host "=== CMake Version ==="
          cmake --version
          Write-Host "`n=== MSVC Compiler (cl.exe) ==="
          Get-Command cl.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          cl.exe 2>&1 | Select-Object -First 1
          Write-Host "`n=== Available CMake Generators ==="
          cmake --help

      - name: Configure CMake
        shell: powershell
        run: |
          $helpText = (cmake --help | Out-String)
          $gen = $null
          if ($helpText -match '\*\s+(Visual Studio [^\r\n=]+?)\s*=') {
              $gen = $Matches[1].Trim()
              Write-Host "Detected default CMake generator: $gen"
          } elseif ($env:VisualStudioVersion -like "18*" -or $env:VSINSTALLDIR -like "*\18\*") {
              $gen = 'Visual Studio 18 2026'
          } elseif ($env:VisualStudioVersion -like "17*" -or $env:VSINSTALLDIR -like "*2022*") {
              $gen = 'Visual Studio 17 2022'
          } elseif ($helpText -match '(Visual Studio 18 \d+)') {
              $gen = $Matches[1]
          } elseif ($helpText -match '(Visual Studio 17 2022)') {
              $gen = 'Visual Studio 17 2022'
          }

          if ($gen) {
              Write-Host "Configuring CMake with generator: $gen (x64)"
              cmake -B build -G "$gen" -A x64 -DCMAKE_BUILD_TYPE=Release
          } else {
              Write-Host "Configuring CMake with default x64 generator"
              cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release
          }

      - name: Build Windows Targets
        run: |
          cmake --build build --config Release --target flux flux-nmh flux_unit_tests openidm openidm-nmh openidm_unit_tests

      - name: Verify PE32+ Binaries & Subsystems
        shell: powershell
        run: |
          $bins = @(
            @{ Path = "build/Release/flux.exe"; ExpectedSubsystem = 2 },
            @{ Path = "build/Release/flux-nmh.exe"; ExpectedSubsystem = 3 },
            @{ Path = "build/Release/flux_unit_tests.exe"; ExpectedSubsystem = 3 }
          )
          foreach ($b in $bins) {
            if (-not (Test-Path $b.Path)) {
              throw "Binary missing: $($b.Path)"
            }
            $bytes = [System.IO.File]::ReadAllBytes($b.Path)
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              throw "Invalid MZ header: $($b.Path)"
            }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0x8664) {
              throw "Expected AMD64 (0x8664) machine type: $($b.Path)"
            }
            $optOffset = $peOffset + 24
            $magic = [BitConverter]::ToUInt16($bytes, $optOffset)
            if ($magic -ne 0x20B) {
              throw "Expected PE32+ (0x20B) magic: $($b.Path)"
            }
            $subsystem = [BitConverter]::ToUInt16($bytes, $optOffset + 68)
            if ($subsystem -ne $b.ExpectedSubsystem) {
              throw "Expected subsystem $($b.ExpectedSubsystem), got $subsystem for $($b.Path)"
            }
            Write-Host "Verified $($b.Path): AMD64 PE32+ Subsystem=$subsystem"
          }

      - name: Run C++ Unit & Regression Tests
        shell: powershell
        run: |
          .\build\Release\flux_unit_tests.exe

      - name: Run Browser Extension Detection Tests
        shell: powershell
        run: |
          node tests/test_extension_detection.js

      - name: Run End-to-End Integration & Benchmark Suite
        shell: powershell
        run: |
          python tests/run_all_integration_tests.py

      - name: Run Automated Performance Benchmarks
        shell: powershell
        run: |
          python scripts/run-benchmarks.py

      - name: Compile Inno Setup Installer
        shell: powershell
        run: |
          if (Test-Path "installer/flux.iss") {
            $issPath = "installer/flux.iss"
          } else {
            $issPath = "installer/openidm.iss"
          }
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $issPath
          } elseif (Test-Path "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe") {
            & "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe" $issPath
          } else {
            choco install innosetup -y
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $issPath
          }

      - name: Package Standalone Portable Release
        shell: powershell
        run: |
          $distDir = "dist/portable/Flux-v0.3.0-win-x64"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          Copy-Item "build/Release/flux.exe" "$distDir/Flux.exe"
          Copy-Item "build/Release/flux-nmh.exe" "$distDir/"
          Copy-Item "tools/win-x64/N_m3u8DL-RE.exe" "$distDir/"
          Copy-Item "tools/win-x64/ffmpeg.exe" "$distDir/"
          Copy-Item -Recurse "extension" "$distDir/extension"
          Copy-Item "README.md" "$distDir/"
          Copy-Item "LICENSE" "$distDir/"
          Copy-Item "THIRD_PARTY_NOTICES.md" "$distDir/"
          Compress-Archive -Path "$distDir/*" -DestinationPath "dist/Flux-v0.3.0-win-x64-portable.zip" -Force
          $setupExe = if (Test-Path "dist/Flux-Setup-x64-0.3.0.exe") { "dist/Flux-Setup-x64-0.3.0.exe" } elseif (Test-Path "dist/OpenIDM-Setup-x64-0.2.0.exe") { "dist/OpenIDM-Setup-x64-0.2.0.exe" } else { $null }
          $hashFiles = @("dist/Flux-v0.3.0-win-x64-portable.zip")
          if ($setupExe) { $hashFiles += $setupExe }
          Get-FileHash -Algorithm SHA256 $hashFiles | Out-File -Encoding utf8 "dist/SHA256SUMS.txt"
          Get-Content "dist/SHA256SUMS.txt"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flux-v0.3.0-windows-x64
          path: |
            dist/*-Setup-*.exe
            dist/Flux-v0.3.0-win-x64-portable.zip
            dist/SHA256SUMS.txt
            benchmarks/latest_metrics.json
            docs/BENCHMARK_REPORT.md
